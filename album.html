<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laufey — Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #f5ede0;
      --gold:   #c8a96e;
      --blush:  #e8b4b8;
      --deep:   #0e0b14;
      --mid:    #1c1528;
      --muted:  #8c7fa0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background-color: var(--deep);
      color: var(--cream);
      overflow-x: hidden;
    }

    /* Stars */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0; }
      50%  { opacity: var(--max-o, 0.7); }
      100% { opacity: 0.1; }
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      background: linear-gradient(to bottom, rgba(14,11,20,0.85) 0%, transparent 100%);
      backdrop-filter: blur(4px);
    }
    .nav-back {
      font-size: .78rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color .3s;
    }
    .nav-back:hover { color: var(--gold); }

    .lang-switch {
      position: absolute;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-size: .72rem;
      letter-spacing: .1em;
      color: var(--muted);
      padding: .2rem .4rem;
      transition: color .3s;
      line-height: 1;
    }
    .lang-btn:hover { color: var(--gold); }
    .lang-btn.active { color: var(--gold); font-weight: 400; }
    .lang-sep { color: rgba(140,127,160,.4); font-size: .7rem; }

    /* Layout */
    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.1rem;
      padding: 8rem 1.5rem 5rem;
    }
    .album-badge {
      display: inline-block;
      border: 1px solid rgba(200,169,110,.5);
      border-radius: 999px;
      padding: .3rem .9rem;
      font-size: .65rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .album-hero-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      font-weight: 400;
      line-height: 1.05;
      color: var(--cream);
    }
    .album-hero-year {
      font-size: .78rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: .2rem auto;
    }
    .album-hero-desc {
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.9;
      color: rgba(245,237,224,.78);
      max-width: 580px;
      margin: 0 auto;
    }

    /* Tracks section */
    #tracks {
      padding: 5rem 1.5rem 6rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .section-label {
      font-size: .7rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .6rem;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 400;
      margin-bottom: 2rem;
      color: var(--cream);
    }

    #track-list-el {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .full-track-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .85rem .6rem;
      border-bottom: 1px solid rgba(200,169,110,.1);
      cursor: pointer;
      transition: background .2s, color .2s;
      border-radius: 6px;
    }
    .full-track-item:first-child { border-top: 1px solid rgba(200,169,110,.1); }
    .full-track-item:hover {
      background: rgba(200,169,110,.07);
      color: var(--gold);
    }
    .full-track-num {
      font-size: .63rem;
      letter-spacing: .14em;
      color: var(--gold);
      width: 1.5rem;
      text-align: right;
      flex-shrink: 0;
      font-weight: 400;
    }
    .full-track-name {
      font-size: .95rem;
      font-weight: 300;
      color: rgba(245,237,224,.85);
      flex: 1;
      transition: color .2s;
    }
    .full-track-item:hover .full-track-name { color: var(--gold); }
    .track-hint {
      font-size: .6rem;
      letter-spacing: .1em;
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .full-track-item:hover .track-hint { opacity: 1; }

    /* Not found */
    #not-found {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.2rem;
      padding: 6rem 1.5rem;
    }
    .nf-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--cream);
    }
    .nf-desc {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(245,237,224,.7);
      line-height: 1.8;
    }
    .nf-back {
      font-size: .78rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      transition: opacity .2s;
    }
    .nf-back:hover { opacity: .75; }

    /* Lyrics Modal */
    #lyrics-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(14,11,20,.88);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    #lyrics-modal.open { opacity: 1; pointer-events: all; }
    .lyrics-box {
      background: var(--mid);
      border: 1px solid rgba(200,169,110,.35);
      border-radius: 16px;
      padding: 2.5rem 2rem 2rem;
      max-width: 560px;
      width: 92%;
      max-height: 82vh;
      overflow-y: auto;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: rgba(200,169,110,.3) transparent;
    }
    .lyrics-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color .2s;
      line-height: 1;
      font-family: serif;
    }
    .lyrics-close:hover { color: var(--gold); }
    .lyrics-num {
      font-size: .65rem;
      letter-spacing: .18em;
      color: var(--gold);
      margin-bottom: .4rem;
    }
    .lyrics-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.35rem;
      color: var(--cream);
      margin-bottom: 1.8rem;
      padding-right: 2rem;
    }
    .lyrics-stanza { margin-bottom: 1.6rem; }
    .lyrics-pair { margin-bottom: .55rem; }
    .lyrics-en {
      font-size: .93rem;
      font-weight: 300;
      color: rgba(245,237,224,.92);
      line-height: 1.5;
      margin: 0;
    }
    .lyrics-zh {
      font-size: .78rem;
      font-weight: 300;
      color: var(--gold);
      opacity: .75;
      line-height: 1.5;
      margin: 0;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 1.5rem 2.5rem;
      font-size: .75rem;
      letter-spacing: .1em;
      color: var(--muted);
    }
    footer .footer-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: .6rem;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .25s;
    }
    footer a:hover { color: var(--gold); }
  </style>
</head>
<body>

  <div id="stars"></div>

  <!-- Lyrics Modal -->
  <div id="lyrics-modal" role="dialog" aria-modal="true">
    <div class="lyrics-box" id="lyrics-box">
      <button class="lyrics-close" id="lyrics-close" aria-label="Close">&#x2715;</button>
      <p class="lyrics-num" id="lyrics-num"></p>
      <p class="lyrics-title" id="lyrics-modal-title"></p>
      <div id="lyrics-content"></div>
    </div>
  </div>

  <nav>
    <a class="nav-back" href="laufey-concert.html" data-i18n="nav.back"></a>
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-zh" onclick="setLang('zh-TW')">繁中</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </nav>

  <!-- Album content -->
  <section id="hero">
    <span class="album-badge" id="album-badge-el"></span>
    <h1 class="album-hero-title" id="album-title-el"></h1>
    <p class="album-hero-year" id="album-year-el"></p>
    <div class="divider"></div>
    <p class="album-hero-desc" id="album-desc-el"></p>
  </section>

  <section id="tracks">
    <p class="section-label" data-i18n="tracks.label"></p>
    <h2 data-i18n="tracks.h2"></h2>
    <ol id="track-list-el"></ol>
  </section>

  <!-- Not found -->
  <div id="not-found">
    <p class="nf-title" data-i18n="notfound.title"></p>
    <p class="nf-desc" data-i18n="notfound.desc"></p>
    <a class="nf-back" href="laufey-concert.html" data-i18n="nav.back"></a>
  </div>

  <footer>
    <p class="footer-name">Laufey</p>
    <a href="laufey-concert.html" data-i18n="footer.back"></a>
  </footer>

  <script>
    /* ── i18n ── */
    const translations = {
      'zh-TW': {
        'nav.back':       '← 返回音樂會',
        'tracks.label':   '曲目列表',
        'tracks.h2':      '歌曲',
        'footer.back':    '← 返回音樂會頁面',
        'notfound.title': '找不到專輯',
        'notfound.desc':  '找不到所請求的專輯。',
      },
      en: {
        'nav.back':       '← Back to Concert',
        'tracks.label':   'Tracklist',
        'tracks.h2':      'The Songs',
        'footer.back':    '← Return to Concert Page',
        'notfound.title': 'Album not found',
        'notfound.desc':  'The requested album could not be found.',
      }
    };

    let currentLang = 'zh-TW';

    function applyLang(lang) {
      const dict = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      document.documentElement.lang = lang;
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh-TW');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      currentLang = lang;

      /* re-render album-specific bilingual fields */
      const albumId = new URLSearchParams(window.location.search).get('id');
      const album = ALBUMS[albumId];
      if (album) {
        document.getElementById('album-badge-el').textContent = lang === 'zh-TW' ? album.typeZh : album.typeEn;
        document.getElementById('album-desc-el').textContent  = lang === 'zh-TW' ? album.descZh : album.descEn;
      }
    }

    function setLang(lang) { applyLang(lang); }

    /* ── Stars ── */
    (function () {
      const container = document.getElementById('stars');
      for (let i = 0; i < 160; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.2 + 0.5;
        s.style.cssText = `
          left: ${Math.random() * 100}%;
          top:  ${Math.random() * 100}%;
          width: ${size}px; height: ${size}px;
          --d: ${(Math.random() * 4 + 2).toFixed(1)}s;
          --max-o: ${(Math.random() * 0.5 + 0.3).toFixed(2)};
          animation-delay: ${(Math.random() * 5).toFixed(1)}s;
        `;
        container.appendChild(s);
      }
    })();

    /* ── Lyrics stanzas (shared references) ── */

    const L_TYPICAL_OF_ME = [
      [
        { en: "It's typical of me to say too little, say it late,",      zh: '這是我的一貫作風，話說得太少，說得太遲，' },
        { en: 'To keep the words inside and let the silence meditate.',   zh: '把話語鎖在心裡，讓沉默自行沉思。' },
        { en: 'You asked me once if I was fine and I said yes of course,',zh: '你曾問我是否還好，我說當然，沒事，' },
        { en: 'While everything inside me pulled against a stronger force.',zh: '而我心底的一切，卻在對抗著更強大的力量。' },
      ],
      [
        { en: 'Typical of me to fall before I learn to stand,',          zh: '這是我的一貫作風，未學站立便已跌倒，' },
        { en: 'To reach across the distance for a cold, retreating hand.',zh: '伸手越過距離，觸碰那已冷卻、正在退縮的手。' },
        { en: "I've written out my feelings in the letters left unsent,", zh: '我把心中的感受寫成信，卻從未寄出，' },
        { en: 'And typical of me to love long after you have went.',      zh: '而這就是我，在你離去很久之後，依然深深愛著。' },
      ],
    ];

    const L_STREET_BY_THE_LAKE = [
      [
        { en: "There's a street by the lake where we used to walk slow,", zh: '湖邊有一條街，我們曾在那裡慢慢散步，' },
        { en: 'Where the autumn leaves gathered and refused to go.',       zh: '那裡的秋葉聚集著，拒絕離去。' },
        { en: 'You would count all the colours like they were a prayer,', zh: '你數著那些顏色，像在念一段禱告，' },
        { en: "And I'd walk half a step just to stay in your air.",       zh: '而我走在你半步之後，只為留在你的氣息之中。' },
      ],
      [
        { en: 'Now I walk by the lake on the coldest of days,',           zh: '如今我在最寒冷的日子獨自走過湖邊，' },
        { en: 'The street holds the memory of your quiet gaze.',          zh: '那條街承載著你靜默目光的記憶。' },
        { en: 'The water is steady, the sky is the same,',               zh: '湖水依然平靜，天空一如往昔，' },
        { en: "But the street by the lake doesn't know your name.",       zh: '但湖邊的那條街，已不再知道你的名字。' },
      ],
    ];

    const L_LIKE_THE_MOVIES = [
      [
        { en: 'I wanted it to go like in the movies,',                   zh: '我希望一切像電影裡那樣發生，' },
        { en: 'A grand piano, rain, a revelation.',                       zh: '一架大鋼琴、雨聲，以及一個啟示。' },
        { en: "You'd turn around and see me standing breathless,",        zh: '你會轉過身，看見我站在那裡，屏住呼吸，' },
        { en: 'And music would arrive without a station.',                zh: '而音樂將無緣無故地響起。' },
      ],
      [
        { en: 'But life moves quieter than the silver screen,',          zh: '但生活比銀幕移動得更加安靜，' },
        { en: 'No sweeping shots, no perfectly placed line.',             zh: '沒有宏大的鏡頭，沒有恰到好處的台詞。' },
        { en: 'You left on a Tuesday, skies were grey and mean,',        zh: '你在一個週二離去，天空陰鬱而刻薄，' },
        { en: 'And no one wrote the score to underline.',                 zh: '沒有人為這一切譜上配樂。' },
      ],
    ];

    const L_VALENTINE = [
      [
        { en: 'You leave me flowers on a Tuesday morning,',              zh: '你在週二早晨給我留下鮮花，' },
        { en: 'Call it accidental, call it spring.',                     zh: '稱之為偶然，稱之為春天的到來。' },
        { en: 'I press them in a book without a warning,',               zh: '我未打招呼便將它們夾入書頁，' },
        { en: 'And wonder what it is that you could bring.',             zh: '心想著你究竟能帶來些什麼。' },
      ],
      [
        { en: 'My Valentine, I wrote your name in margins,',             zh: '我的情人節，我把你的名字寫在書頁邊緣，' },
        { en: 'Beside the poets who knew better things.',                zh: '寫在那些懂得更美好事物的詩人旁邊。' },
        { en: 'Love has its own peculiar sacred seasons,',               zh: '愛有著它獨特而神聖的季節，' },
        { en: 'And you arrived with all the warmth it brings.',          zh: '而你帶著它所有的溫暖降臨。' },
      ],
    ];

    const L_FALLING_BEHIND = [
      [
        { en: "I'm always falling behind the ones I love,",              zh: '我總是落後於我所愛的人，' },
        { en: 'A half a season slower than the rest.',                   zh: '比其他所有人慢半個季節。' },
        { en: "The summer's gone before I've had enough,",               zh: '夏天在我尚未盡興時便已過去，' },
        { en: 'And spring was barely time to pass the test.',            zh: '而春天幾乎不夠讓我通過考驗。' },
      ],
      [
        { en: 'You move through life at such a steady pace,',            zh: '你以如此穩定的步伐走過生命，' },
        { en: 'While I am still replaying last July.',                   zh: '而我仍在回放上一個七月。' },
        { en: "It isn't grief exactly, more like grace,",                zh: '這不完全是悲傷，更像是一種優雅，' },
        { en: 'The art of watching something good go by.',               zh: '一門眼看美好事物流逝而過的藝術。' },
      ],
    ];

    const L_LOVESICK = [
      [
        { en: "I'm lovesick and I know it's my own doing,",              zh: '我害了相思，我知道這是咎由自取，' },
        { en: 'I saw the signs and chose to look away.',                 zh: '我看到了那些跡象，卻選擇別過目光。' },
        { en: 'The fever that your absence keeps renewing,',             zh: '你的缺席不斷喚醒的那場熱病，' },
        { en: "Won't break until I've nothing left to say.",             zh: '在我再無一語之前，不會退燒。' },
      ],
      [
        { en: "Oh I'm lovesick in the sweetest kind of pain,",          zh: '哦，我害著最甜蜜的那種相思病，' },
        { en: 'Where every memory is gold and aches.',                   zh: '每一段記憶都是閃耀的黃金，帶著隱痛。' },
        { en: "I'd take the fever all over again,",                     zh: '我願意再次經歷那場熱病，' },
        { en: 'For all the tender damage that it makes.',                zh: '為了它所造成的每一處溫柔的傷。' },
      ],
    ];

    const L_BEST_FRIEND = [
      [
        { en: 'You are the only one I call at midnight,',               zh: '你是我唯一在午夜撥電話的人，' },
        { en: "Who doesn't ask me why I sound like rain.",               zh: '不會問我為何聽起來像在下雨。' },
        { en: 'You know the rooms I hide in when the light fades,',     zh: '你知道我在光消逝時躲藏的那些房間，' },
        { en: 'And never make me explain the dark again.',              zh: '從不讓我再次解釋那片黑暗。' },
      ],
      [
        { en: 'Best friend, you are my favourite kind of constant,',    zh: '最好的朋友，你是我最喜歡的那種恆常，' },
        { en: 'The one who stays through every shifting season.',        zh: '在每一個流轉的季節都留下來的人。' },
        { en: 'You hold my hand without needing a reason,',             zh: '你握著我的手，不需要任何理由，' },
        { en: 'And love me in a way that asks no reason.',              zh: '以一種無需理由的方式愛著我。' },
      ],
    ];

    const L_AEDIS = [
      [
        { en: 'In the aedis of my heart I built a room for you,',       zh: '在我心靈的殿堂裡，我為你建了一個房間，' },
        { en: 'With high white ceilings and a window facing east.',      zh: '有著高高的白色天花板，以及面向東方的窗戶。' },
        { en: 'I swept the floors and learned to let the morning through,',zh: '我掃淨了地板，學會讓清晨的光透進來，' },
        { en: 'And set a place for you at every solemn feast.',          zh: '並在每一次莊嚴的盛宴上，為你留下一個位置。' },
      ],
      [
        { en: 'But temples made of longing fall to ruin,',              zh: '但由思念建造的神殿終將頹圮，' },

    /* ── Modal logic ── */
    const modal         = document.getElementById('lyrics-modal');
    const lyricsContent = document.getElementById('lyrics-content');
    const lyricsNumEl   = document.getElementById('lyrics-num');
    const lyricsTitleEl = document.getElementById('lyrics-modal-title');

    function openLyrics(track) {
      lyricsNumEl.textContent   = track.num;
      lyricsTitleEl.textContent = track.title;
      lyricsContent.innerHTML = track.stanzas.map(stanza =>
        `<div class="lyrics-stanza">${
          stanza.map(pair =>
            `<div class="lyrics-pair">
              <p class="lyrics-en">${pair.en}</p>
              <p class="lyrics-zh">${pair.zh}</p>
            </div>`
          ).join('')
        }</div>`
      ).join('');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLyrics() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lyrics-close').addEventListener('click', closeLyrics);
    modal.addEventListener('click', e => { if (e.target === modal) closeLyrics(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLyrics(); });

    /* ── Render page ── */
    (function () {
      const albumId = new URLSearchParams(window.location.search).get('id');
      const album   = ALBUMS[albumId];

      const heroEl   = document.getElementById('hero');
      const tracksEl = document.getElementById('tracks');
      const nfEl     = document.getElementById('not-found');

      if (!album) {
        heroEl.style.display   = 'none';
        tracksEl.style.display = 'none';
        nfEl.style.display     = 'flex';
        applyLang('zh-TW');
        return;
      }

      /* Populate hero */
      document.getElementById('album-title-el').textContent = album.title;
      document.getElementById('album-year-el').textContent  = album.year;
      document.title = 'Laufey — ' + album.title;

      /* Render tracks */
      const list = document.getElementById('track-list-el');
      album.tracks.forEach((track, idx) => {
        const li = document.createElement('li');
        li.className = 'full-track-item';
        li.dataset.track = idx;
        li.innerHTML = `
          <span class="full-track-num">${track.num}</span>
          <span class="full-track-name">${track.title}</span>
          <span class="track-hint">歌詞 ↗</span>
        `;
        li.addEventListener('click', () => openLyrics(track));
        list.appendChild(li);
      });

      /* Apply default language (sets badge + desc) */
      applyLang('zh-TW');
    })();
  </script>
