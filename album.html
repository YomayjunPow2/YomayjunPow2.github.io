<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore Laufey's discography — tracklists and lyrics for every album." />
  <title>Laufey — Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #f5ede0;
      --gold:   #c8a96e;
      --blush:  #e8b4b8;
      --deep:   #0e0b14;
      --mid:    #1c1528;
      --muted:  #8c7fa0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background-color: var(--deep);
      color: var(--cream);
      overflow-x: hidden;
    }

    /* Stars */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0; }
      50%  { opacity: var(--max-o, 0.7); }
      100% { opacity: 0.1; }
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      background: linear-gradient(to bottom, rgba(14,11,20,0.85) 0%, transparent 100%);
      backdrop-filter: blur(4px);
    }
    .nav-back {
      font-size: .78rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color .3s;
    }
    .nav-back:hover { color: var(--gold); }

    .lang-switch {
      position: absolute;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-size: .72rem;
      letter-spacing: .1em;
      color: var(--muted);
      padding: .2rem .4rem;
      transition: color .3s;
      line-height: 1;
    }
    .lang-btn:hover { color: var(--gold); }
    .lang-btn.active { color: var(--gold); font-weight: 400; }
    .lang-sep { color: rgba(140,127,160,.4); font-size: .7rem; }

    /* Layout */
    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.1rem;
      padding: 8rem 1.5rem 5rem;
    }
    .album-badge {
      display: inline-block;
      border: 1px solid rgba(200,169,110,.5);
      border-radius: 999px;
      padding: .3rem .9rem;
      font-size: .65rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .album-hero-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      font-weight: 400;
      line-height: 1.05;
      color: var(--cream);
    }
    .album-hero-year {
      font-size: .78rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: .2rem auto;
    }
    .album-hero-desc {
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.9;
      color: rgba(245,237,224,.78);
      max-width: 580px;
      margin: 0 auto;
    }
    .album-ext-links {
      display: flex;
      gap: .8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .4rem;
    }
    .album-ext-link {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .4rem 1.1rem;
      border-radius: 999px;
      font-size: .72rem;
      letter-spacing: .12em;
      text-decoration: none;
      font-family: 'Lato', sans-serif;
      transition: opacity .2s, transform .2s;
    }
    .album-ext-link:hover { opacity: .8; transform: translateY(-1px); }
    .album-ext-link.spotify { background: rgba(200,169,110,.12); color: var(--gold); border: 1px solid rgba(200,169,110,.4); }
    .album-ext-link.youtube { background: rgba(232,180,184,.12); color: var(--blush); border: 1px solid rgba(232,180,184,.4); }
    .track-ext-links {
      display: flex;
      gap: .4rem;
      opacity: 0;
      transition: opacity .2s;
      flex-shrink: 0;
    }
    .full-track-item:hover .track-ext-links { opacity: 1; }
    @media (hover: none) { .track-ext-links { opacity: 1; } }
    .track-ext-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      text-decoration: none;
      font-size: 10px;
      transition: transform .15s;
    }
    .track-ext-link:hover { transform: scale(1.2); }
    .track-ext-link.sp { background: rgba(200,169,110,.15); color: var(--gold); border: 1px solid rgba(200,169,110,.35); }
    .track-ext-link.yt { background: rgba(232,180,184,.15); color: var(--blush); border: 1px solid rgba(232,180,184,.35); }

    /* Tracks section */
    #tracks {
      padding: 5rem 1.5rem 6rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .section-label {
      font-size: .7rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .6rem;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 400;
      margin-bottom: 2rem;
      color: var(--cream);
    }
    .track-search-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.4rem;
    }
    .track-search {
      width: 100%;
      max-width: 340px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(200,169,110,.2);
      border-radius: 999px;
      color: var(--cream);
      font-family: 'Lato', sans-serif;
      font-size: .82rem;
      letter-spacing: .06em;
      padding: .5rem 1.25rem;
      outline: none;
      transition: border-color .25s;
      -webkit-appearance: none;
    }
    .track-search::placeholder { color: var(--muted); }
    .track-search:focus { border-color: rgba(200,169,110,.55); }

    #track-list-el {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .full-track-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .85rem .6rem;
      border-bottom: 1px solid rgba(200,169,110,.1);
      cursor: pointer;
      transition: background .2s, color .2s;
      border-radius: 6px;
    }
    .full-track-item:first-child { border-top: 1px solid rgba(200,169,110,.1); }
    .full-track-item:hover {
      background: rgba(200,169,110,.07);
      color: var(--gold);
    }
    .full-track-num {
      font-size: .63rem;
      letter-spacing: .14em;
      color: var(--gold);
      width: 1.5rem;
      text-align: right;
      flex-shrink: 0;
      font-weight: 400;
    }
    .full-track-name {
      font-size: .95rem;
      font-weight: 300;
      color: rgba(245,237,224,.85);
      flex: 1;
      transition: color .2s;
    }
    .full-track-item:hover .full-track-name { color: var(--gold); }
    .track-hint {
      font-size: .6rem;
      letter-spacing: .1em;
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .full-track-item:hover .track-hint { opacity: 1; }

    /* Not found */
    #not-found {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.2rem;
      padding: 6rem 1.5rem;
    }
    .nf-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--cream);
    }
    .nf-desc {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(245,237,224,.7);
      line-height: 1.8;
    }
    .nf-back {
      font-size: .78rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      transition: opacity .2s;
    }
    .nf-back:hover { opacity: .75; }

    /* Lyrics Modal */
    #lyrics-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(14,11,20,.88);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    #lyrics-modal.open { opacity: 1; pointer-events: all; }
    .lyrics-box {
      background: var(--mid);
      border: 1px solid rgba(200,169,110,.35);
      border-radius: 16px;
      padding: 2.5rem 2rem 2rem;
      max-width: 560px;
      width: 92%;
      max-height: 82vh;
      overflow-y: auto;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: rgba(200,169,110,.3) transparent;
    }
    .lyrics-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color .2s;
      line-height: 1;
      font-family: serif;
    }
    .lyrics-close:hover { color: var(--gold); }
    .lyrics-num {
      font-size: .65rem;
      letter-spacing: .18em;
      color: var(--gold);
      margin-bottom: .4rem;
    }
    .lyrics-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.35rem;
      color: var(--cream);
      margin-bottom: 1.8rem;
      padding-right: 2rem;
    }
    #lyrics-bg-story {
      border-left: 2px solid rgba(200,169,110,.3);
      padding: .7rem 1rem;
      margin-bottom: 1.6rem;
      background: rgba(200,169,110,.04);
      border-radius: 0 6px 6px 0;
    }
    .backstory-label {
      font-size: .58rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .35rem;
    }
    .backstory-text {
      font-size: .82rem;
      line-height: 1.75;
      color: rgba(245,237,224,.65);
      font-style: italic;
      margin: 0;
    }
    .lyrics-pair { margin-bottom: .55rem; }
    .lyrics-en {
      font-size: .93rem;
      font-weight: 300;
      color: rgba(245,237,224,.92);
      line-height: 1.5;
      margin: 0;
    }
    .lyrics-zh {
      font-size: .78rem;
      font-weight: 300;
      color: var(--gold);
      opacity: .75;
      line-height: 1.5;
      margin: 0;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 1.5rem 2.5rem;
      font-size: .75rem;
      letter-spacing: .1em;
      color: var(--muted);
    }
    footer .footer-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: .6rem;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .25s;
    }
    footer a:hover { color: var(--gold); }

    /* ── Lyrics loading / error states ── */
    .lyrics-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem 1rem;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(200,169,110,.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lyrics-loading p {
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .12em;
    }
    .lyrics-zh.pending { opacity: .35; font-style: italic; }
    .lyrics-not-found {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.8;
    }
    .lyrics-gap { height: .9rem; }
  </style>
</head>
<body>

  <div id="stars"></div>

  <!-- Lyrics Modal -->
  <div id="lyrics-modal" role="dialog" aria-modal="true" aria-labelledby="lyrics-modal-title">
    <div class="lyrics-box" id="lyrics-box">
      <button class="lyrics-close" id="lyrics-close" aria-label="Close">&#x2715;</button>
      <p class="lyrics-num" id="lyrics-num"></p>
      <p class="lyrics-title" id="lyrics-modal-title"></p>
      <div id="lyrics-bg-story" style="display:none">
        <p class="backstory-label" data-i18n="lyrics.story.label"></p>
        <p class="backstory-text" id="lyrics-backstory-text"></p>
      </div>
      <div id="lyrics-content"></div>
    </div>
  </div>

  <nav>
    <a class="nav-back" href="laufey-concert.html" data-i18n="nav.back"></a>
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-zh" onclick="setLang('zh-TW')">繁中</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </nav>

  <!-- Album content -->
  <section id="hero">
    <span class="album-badge" id="album-badge-el"></span>
    <h1 class="album-hero-title" id="album-title-el"></h1>
    <p class="album-hero-year" id="album-year-el"></p>
    <div class="divider"></div>
    <p class="album-hero-desc" id="album-desc-el"></p>
    <div class="album-ext-links" id="album-ext-links-el">
      <a class="album-ext-link spotify" id="album-spotify-link" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Spotify
      </a>
      <a class="album-ext-link youtube" id="album-youtube-link" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTube Music
      </a>
    </div>
  </section>

  <section id="tracks">
    <p class="section-label" data-i18n="tracks.label"></p>
    <h2 data-i18n="tracks.h2"></h2>
    <div class="track-search-wrap">
      <input type="search" class="track-search" id="track-search" autocomplete="off" spellcheck="false">
    </div>
    <ol id="track-list-el"></ol>
  </section>

  <!-- Not found -->
  <div id="not-found">
    <p class="nf-title" data-i18n="notfound.title"></p>
    <p class="nf-desc" data-i18n="notfound.desc"></p>
    <a class="nf-back" href="laufey-concert.html" data-i18n="nav.back"></a>
  </div>

  <footer>
    <p class="footer-name">Laufey</p>
    <a href="laufey-concert.html" data-i18n="footer.back"></a>
  </footer>

  <script>
    /* ── i18n ── */
    const translations = {
      'zh-TW': {
        'nav.back':         '← 返回音樂會',
        'tracks.label':     '曲目列表',
        'tracks.h2':        '歌曲',
        'footer.back':      '← 返回音樂會頁面',
        'notfound.title':   '找不到專輯',
        'notfound.desc':    '找不到所請求的專輯。',
        'lyrics.loading':   '正在載入歌詞…',
        'lyrics.notfound':  '找不到歌詞 · 請稍後再試',
        'lyrics.story.label': '歌曲背景',
      },
      en: {
        'nav.back':         '← Back to Concert',
        'tracks.label':     'Tracklist',
        'tracks.h2':        'The Songs',
        'footer.back':      '← Return to Concert Page',
        'notfound.title':   'Album not found',
        'notfound.desc':    'The requested album could not be found.',
        'lyrics.loading':   'Loading lyrics…',
        'lyrics.notfound':  'Lyrics not found · Please try again later',
        'lyrics.story.label': 'Background',
      }
    };

    let currentLang = 'zh-TW';
    let currentBackstory = { en: null, zh: null };
    let lastFocused = null;

    function applyLang(lang) {
      const dict = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      document.documentElement.lang = lang;
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh-TW');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      currentLang = lang;

      /* sync track-hint and search placeholder to language */
      const hintText = lang === 'zh-TW' ? '歌詞 ↗' : 'lyrics ↗';
      document.querySelectorAll('.track-hint').forEach(el => { el.textContent = hintText; });
      const srch = document.getElementById('track-search');
      if (srch) srch.placeholder = lang === 'zh-TW' ? '搜尋曲目…' : 'Search tracks…';

      /* re-render album-specific bilingual fields */
      const albumId = new URLSearchParams(window.location.search).get('id');
      const album = ALBUMS[albumId];
      if (album) {
        document.getElementById('album-badge-el').textContent = lang === 'zh-TW' ? album.typeZh : album.typeEn;
        document.getElementById('album-desc-el').textContent  = lang === 'zh-TW' ? album.descZh : album.descEn;
      }
    }

    function setLang(lang) {
      applyLang(lang);
      const bgEl = document.getElementById('lyrics-bg-story');
      const bgText = document.getElementById('lyrics-backstory-text');
      if (bgEl && bgText && bgEl.style.display !== 'none') {
        const txt = (lang === 'zh-TW' && currentBackstory.zh) ? currentBackstory.zh : (currentBackstory.en || '');
        if (txt) bgText.textContent = txt;
      }
    }

    /* ── Stars ── */
    (function () {
      const container = document.getElementById('stars');
      for (let i = 0; i < 160; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.2 + 0.5;
        s.style.cssText = `
          left: ${Math.random() * 100}%;
          top:  ${Math.random() * 100}%;
          width: ${size}px; height: ${size}px;
          --d: ${(Math.random() * 4 + 2).toFixed(1)}s;
          --max-o: ${(Math.random() * 0.5 + 0.3).toFixed(2)};
          animation-delay: ${(Math.random() * 5).toFixed(1)}s;
        `;
        container.appendChild(s);
      }
    })();

    /* ── Album data (no stanzas — lyrics fetched at runtime) ── */
    const ALBUMS = {
      'typical-of-me': {
        title: 'Typical of Me', year: '2021',
        spotifyUrl: 'https://open.spotify.com/search/Laufey%20Typical%20of%20Me',
        youtubeUrl: 'https://music.youtube.com/search?q=Laufey+Typical+of+Me',
        typeEn: 'Debut EP', typeZh: '首張 EP',
        descEn: "Four songs that introduced the world to Laufey's hazy, jazz-inflected sound. Delicate arrangements of cello, guitar, and brushed percussion frame lyrics about love, longing, and the specific ache of saying too little, too late.",
        descZh: '四首歌曲，將 Laufey 充滿爵士氣息的迷朦音樂帶給世界。大提琴、吉他與刷擊打擊樂的細膩編排，框住了關於愛、思念，以及說得太少、太遲的特殊痛苦的歌詞。',
        tracks: [
          { num: '01', title: 'Typical of Me' },
          { num: '02', title: 'Street by the Lake' },
          { num: '03', title: 'Like the Movies' },
          { num: '04', title: 'Valentine' },
        ],
      },
      'everything-i-know-about-love': {
        title: 'Everything I Know About Love', year: '2022',

    /* ── Modal elements ── */
    const modal         = document.getElementById('lyrics-modal');
    const lyricsContent = document.getElementById('lyrics-content');
    const lyricsNumEl   = document.getElementById('lyrics-num');
    const lyricsTitleEl = document.getElementById('lyrics-modal-title');

    /* ── Lyrics API helpers ── */
    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function getCacheKey(title) {
      return 'laufey_lyrics_' + title.toLowerCase().replace(/\s+/g, '_');
    }

    function saveCache(key, enLines, zhLines) {
      try {
        localStorage.setItem(key, JSON.stringify({ en: enLines, zh: zhLines, ts: Date.now() }));
      } catch (_) {}
    }

    function getCache(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_) { return null; }
    }

    async function fetchBackstory(cleanTitle) {
      const wikiKey = 'laufey_wiki_' + cleanTitle.toLowerCase().replace(/\s+/g, '_');
      try {
        const raw = localStorage.getItem(wikiKey);
        if (raw) {
          const p = JSON.parse(raw);
          if (Date.now() - p.ts < 7 * 24 * 3600 * 1000)
            return { en: p.en || p.text || null, zh: p.zh || null };
        }
      } catch (_) {}
      const tries = [cleanTitle + ' (Laufey song)', cleanTitle + ' (song)', 'Laufey ' + cleanTitle];
      let found = null;
      for (const t of tries) {
        try {
          const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t));
          if (!res.ok) continue;
          const data = await res.json();
          const text = (data.extract || '').trim();
          if (text.length > 80) { found = text; break; }
        } catch (_) {}
      }
      let zh = null;
      if (found) { try { zh = await translateBackstory(found); } catch (_) {} }
      try { localStorage.setItem(wikiKey, JSON.stringify({ en: found, zh, ts: Date.now() })); } catch (_) {}
      return { en: found, zh };
    }

    async function translateBackstory(text) {
      const sentences = text.match(/[^.!?]+[.!?]+[\s]*/g) || [text];
      const chunks = [];
      let buf = '';
      for (const s of sentences) {
        if ((buf + s).length > 480) { if (buf) chunks.push(buf.trim()); buf = s; }
        else buf += s;
      }
      if (buf.trim()) chunks.push(buf.trim());
      const results = await Promise.allSettled(chunks.map(c => translateLine(c)));
      return results.map((r, i) => r.status === 'fulfilled' ? r.value : chunks[i]).join(' ');
    }

    async function translateLine(text) {
      const guarded = text.replace(/\bLaufey\b/gi, '«LAUFEY»');
      const res = await fetch(
        'https://api.mymemory.translated.net/get?q=' +
        encodeURIComponent(guarded) + '&langpair=en|zh-TW'
      );
      if (!res.ok) throw new Error('translate error');
      const data = await res.json();
      if (data.responseStatus === 200) return data.responseData.translatedText.replace(/«LAUFEY»/gi, 'Laufey');
      throw new Error('translate failed');
    }

    function renderLines(enLines, zhLines) {
      lyricsContent.innerHTML = enLines.map((line, i) => {
        if (!line.trim()) return '<div class="lyrics-gap"></div>';
        const zh = (zhLines && zhLines[i]) ? zhLines[i] : '';
        return '<div class="lyrics-pair" data-line="' + i + '">' +
          '<p class="lyrics-en">' + escHtml(line) + '</p>' +
          '<p class="lyrics-zh' + (zh ? '' : ' pending') + '">' + escHtml(zh || '…') + '</p>' +
          '</div>';
      }).join('');
    }

    async function translateAllLines(rawLines) {
      const nonEmpty = rawLines
        .map((line, i) => ({ text: line.trim(), idx: i }))
        .filter(({ text }) => text.length > 0);

      const results = await Promise.allSettled(
        nonEmpty.map(({ text }) => translateLine(text))
      );

      const zhLines = new Array(rawLines.length).fill('');
      nonEmpty.forEach(({ idx }, i) => {
        const el = lyricsContent.querySelector('[data-line="' + idx + '"] .lyrics-zh');
        const r = results[i];
        const text = r.status === 'fulfilled' ? r.value : '';
        zhLines[idx] = text;
        if (!el) return;
        el.textContent = text;
        el.classList.remove('pending');
      });
      return zhLines;
    }

    async function openLyrics(track) {
      lastFocused = document.activeElement;
      lyricsNumEl.textContent   = track.num;
      lyricsTitleEl.textContent = track.title;
      lyricsContent.innerHTML =
        '<div class="lyrics-loading">' +
        '<div class="loading-spinner"></div>' +
        '<p data-i18n="lyrics.loading"></p></div>';
      applyLang(currentLang);
      modal.classList.add('open');
      document.getElementById('lyrics-close').focus();
      document.body.style.overflow = 'hidden';
      document.getElementById('lyrics-bg-story').style.display = 'none';

      // Strip version suffixes for the API query: "(Symphony Version)", "(Acoustic)", etc.
      const cleanTitle = track.title.replace(/\s*\([^)]*\)\s*/g, '').trim();
      const cacheKey = getCacheKey(cleanTitle);
      const backstoryPromise = fetchBackstory(cleanTitle);

      try {
        const res = await fetch(
          'https://api.lyrics.ovh/v1/Laufey/' + encodeURIComponent(cleanTitle)
        );
        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        if (!data.lyrics) throw new Error('empty');

        const rawLines = data.lyrics.replace(/\r\n/g, '\n').split('\n');
        renderLines(rawLines, null);
        const zhLines = await translateAllLines(rawLines);
        saveCache(cacheKey, rawLines, zhLines);
      } catch (_) {
        const cached = getCache(cacheKey);
        if (cached) {
          renderLines(cached.en, cached.zh);
        } else {
          lyricsContent.innerHTML =
            '<p class="lyrics-not-found" data-i18n="lyrics.notfound"></p>';
          applyLang(currentLang);
        }
      }

      try {
        const story = await backstoryPromise;
        currentBackstory = story || { en: null, zh: null };
        const bgEl = document.getElementById('lyrics-bg-story');
        const bgText = document.getElementById('lyrics-backstory-text');
        if (story && (story.en || story.zh) && bgEl && bgText) {
          bgText.textContent = (currentLang === 'zh-TW' && story.zh) ? story.zh : (story.en || '');
          bgEl.style.display = 'block';
        }
      } catch (_) {}
    }

    function closeLyrics() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      currentBackstory = { en: null, zh: null };
      if (lastFocused) lastFocused.focus();
    }

    document.getElementById('lyrics-close').addEventListener('click', closeLyrics);
    modal.addEventListener('click', e => { if (e.target === modal) closeLyrics(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLyrics(); });

          '<svg viewBox="0 0 24 24" width="10" height="10"><path fill="currentColor" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' +
          '</a>' +
          '<a class="track-ext-link yt" href="' + ytBase + ytEnc + '" target="_blank" rel="noopener noreferrer" title="YouTube" aria-label="Open on YouTube">' +
          '<svg viewBox="0 0 24 24" width="10" height="10"><path fill="currentColor" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>' +
          '</a>' +
          '</div>';
        li.addEventListener('click', () => openLyrics(track));
        li.querySelectorAll('.track-ext-link').forEach(a => a.addEventListener('click', e => e.stopPropagation()));
        list.appendChild(li);
      });

      applyLang('zh-TW');

      document.getElementById('track-search').addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        document.querySelectorAll('.full-track-item').forEach(li => {
          const name = li.querySelector('.full-track-name').textContent.toLowerCase();
          li.style.display = (q && !name.includes(q)) ? 'none' : '';
        });
      });
    })();
